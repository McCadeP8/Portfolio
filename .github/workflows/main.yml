name: Post to Discord (Legacy - Manual Only)

on:
  workflow_dispatch:

jobs:
  Get-NBA-MVP-Odds:
    name: Get Latest MVP Odds
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: 'release'

      - name: Install libcurl and libssl on Linux
        run: sudo apt-get -y install libcurl4-openssl-dev
        shell: bash

      - name: Cache CRAN packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Install CRAN packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: tidyverse, httr

      - name: Run R update script
        run: Rscript SBC_Cap_Sheets/TestAutomation.R
        shell: bash
