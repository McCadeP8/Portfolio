name: Nightly Data Update

on:
  schedule:
    # One run at 14:30 UTC: 8:30 a.m. Mountain in daylight time, 7:30 a.m. after
    # Nov. 1. GitHub often starts scheduled runs late, so this lands near 9 a.m.
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      pretend_date:
        description: Publish the Fantrax posts as if it were this date (YYYY-MM-DD). Leave blank for today.
        required: false
        default: ""

concurrency:
  group: sbc-nightly-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SBC_CURRENT_SBC_YEAR: "2027"
      SBC_LIVE_MODE: shadow
      SBC_RUNTIME_ROOT: .runtime
      # split: mobile_* images go to DISCORD_WEBHOOK_URL_MOBILE, the rest to
      # DISCORD_WEBHOOK_URL_WEB, record announcements to both.
      SBC_DISCORD_ROUTING_MODE: split
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URLS: ${{ secrets.DISCORD_WEBHOOK_URLS }}
      DISCORD_WEBHOOK_URL_MOBILE: ${{ secrets.DISCORD_WEBHOOK_URL_MOBILE }}
      DISCORD_WEBHOOK_URL_WEB: ${{ secrets.DISCORD_WEBHOOK_URL_WEB }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: SBC_Streamlit/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r SBC_Streamlit/requirements.txt

      - name: Run tests
        working-directory: SBC_Streamlit
        run: python -m unittest discover -s tests -v

      - name: Refresh data and publish the Fantrax rotation
        working-directory: SBC_Streamlit
        env:
          PRETEND_DATE: ${{ inputs.pretend_date }}
        run: |
          # A pretend date shifts only the Fantrax posts; the data refresh stays on today.
          if [[ -n "$PRETEND_DATE" ]]; then
            export SBC_FANTRAX_DATE_OFFSET_DAYS=$(( ( $(date -u +%s -d "$(date -u +%F)") - $(date -u +%s -d "$PRETEND_DATE") ) / 86400 ))
            echo "Publishing as $PRETEND_DATE (offset $SBC_FANTRAX_DATE_OFFSET_DAYS days)"
          fi
          python -m sbc_backend.jobs.overnight --strict --lookback-days 3 --fantrax-slot all

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add SBC_Streamlit/*.parquet SBC_Streamlit/data_snapshots/
          git diff --staged --quiet || git commit -m "Auto-update data files [skip ci]"
          git push
