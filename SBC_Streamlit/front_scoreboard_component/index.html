<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: transparent;
      color: #17212b;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #sbc-scorebar {
      height: 112px;
      display: grid;
      grid-template-columns: 36px 145px minmax(0, 1fr) 36px;
      align-items: stretch;
      border: 1px solid #d8dee5;
      border-radius: 12px;
      background: #f7f8fa;
      overflow: hidden;
    }

    .pick {
      padding: 15px 10px;
      border-right: 1px solid #d8dee5;
      background: #fff;
    }

    .pick span {
      display: block;
      margin-bottom: 8px;
      color: #7a8490;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #17212b;
      font-size: 12px;
      font-weight: 800;
    }

    .arrow {
      border: 0;
      background: #fff;
      color: #17212b;
      cursor: pointer;
      font-size: 27px;
    }

    .arrow:hover,
    .arrow:focus-visible {
      background: #eef2f5;
      color: #d91f2b;
      outline: 0;
    }

    .track {
      display: flex;
      gap: 0;
      overflow-x: auto;
      background: #eef1f4;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .track::-webkit-scrollbar {
      display: none;
    }

    .game {
      flex: 0 0 176px;
      border: 0;
      border-right: 1px solid #ccd3da;
      background: #fff;
      padding: 9px 11px;
      color: #17212b;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .game:hover,
    .game:focus-visible {
      background: #f5f8fa;
      box-shadow: inset 0 -3px #e32231;
      outline: 0;
    }

    .meta {
      display: flex;
      justify-content: flex-start;
      gap: 5px;
      align-items: center;
      margin-bottom: 5px;
      color: #78838e;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .meta b {
      color: #d91f2b;
    }

    .meta i {
      border-radius: 3px;
      padding: 2px 4px;
      background: #183c5a;
      color: #fff;
      font-size: 7px;
      font-style: normal;
    }

    .meta i.ist {
      background: #7b2cbf;
    }

    .meta i.playoffs {
      background: #d48a00;
    }

    .team {
      height: 29px;
      display: grid;
      grid-template-columns: 21px 1fr auto;
      gap: 6px;
      align-items: center;
    }

    .team img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .team span {
      font-size: 11px;
      font-weight: 900;
    }

    .team strong {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 650px) {
      #sbc-scorebar {
        height: 138px;
        grid-template-columns: 34px minmax(0, 1fr) 34px;
        grid-template-rows: 42px minmax(0, 1fr);
      }

      .pick {
        grid-column: 1 / -1;
        grid-row: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 8px 12px;
        border-right: 0;
        border-bottom: 1px solid #d8dee5;
      }

      .pick span {
        flex: 0 0 auto;
        margin: 0;
        white-space: nowrap;
      }

      select {
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
        text-align: right;
      }

      #prev {
        grid-column: 1;
        grid-row: 2;
      }

      .track {
        grid-column: 2;
        grid-row: 2;
        scroll-snap-type: x mandatory;
      }

      #next {
        grid-column: 3;
        grid-row: 2;
      }

      .game {
        flex: 0 0 100%;
        min-width: 0;
        padding: 8px 12px;
        scroll-snap-align: start;
      }
    }
  </style>
</head>
<body>
  <div id="sbc-scorebar">
    <button class="arrow" id="prev" type="button" aria-label="Scroll scores left">&#8249;</button>
    <label class="pick">
      <span>Matchup window</span>
      <select id="window" aria-label="Matchup window"></select>
    </label>
    <div class="track" id="track"></div>
    <button class="arrow" id="next" type="button" aria-label="Scroll scores right">&#8250;</button>
  </div>

  <script>
    const select = document.getElementById("window");
    const track = document.getElementById("track");
    let windows = [];
    let selectedIndex = 0;
    let initialized = false;

    function sendMessage(type, payload = {}) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type, ...payload },
        "*"
      );
    }

    function setFrameHeight(height) {
      sendMessage("streamlit:setFrameHeight", { height });
    }

    function syncFrameHeight() {
      setFrameHeight(window.innerWidth <= 650 ? 146 : 120);
    }

    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value });
    }

    function escapeHtml(value) {
      return String(value).replace(
        /[&<>"]/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;"
        })[character]
      );
    }

    function formatScore(value) {
      return value === null ? "0–0" : Number(value).toFixed(1);
    }

    function renderGames() {
      const matchupWindow = windows[selectedIndex];
      track.innerHTML = "";
      if (!matchupWindow) {
        return;
      }

      matchupWindow.games.forEach(game => {
        const button = document.createElement("button");
        const badge = game.type === "In-Season Tournament"
          ? '<i class="ist">IST</i>'
          : game.type === "Playoffs"
            ? '<i class="playoffs">PLAYOFFS</i>'
            : "";

        button.type = "button";
        button.className = "game";
        button.setAttribute(
          "aria-label",
          `Open full box score for ${game.a.name} versus ${game.b.name}`
        );
        button.innerHTML = `
          <div class="meta"><b>${escapeHtml(game.status)}</b>${badge}</div>
          <div class="team">
            <img src="${escapeHtml(game.a.logo)}" alt="">
            <span>${escapeHtml(game.a.abbr)}</span>
            <strong>${formatScore(game.as)}</strong>
          </div>
          <div class="team">
            <img src="${escapeHtml(game.b.logo)}" alt="">
            <span>${escapeHtml(game.b.abbr)}</span>
            <strong>${formatScore(game.bs)}</strong>
          </div>
        `;
        button.addEventListener("click", () => {
          setComponentValue({ key: game.key, nonce: Date.now() });
        });
        track.appendChild(button);
      });
      track.scrollLeft = 0;
    }

    function renderScorebar(args) {
      windows = Array.isArray(args.windows) ? args.windows : [];
      if (!initialized) {
        const requestedIndex = Number(args.initial_index ?? 0);
        selectedIndex = Math.min(
          Math.max(Number.isFinite(requestedIndex) ? requestedIndex : 0, 0),
          Math.max(windows.length - 1, 0)
        );
        initialized = true;
      } else {
        selectedIndex = Math.min(selectedIndex, Math.max(windows.length - 1, 0));
      }

      select.innerHTML = "";
      windows.forEach((matchupWindow, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = matchupWindow.label;
        select.appendChild(option);
      });
      select.value = String(selectedIndex);
      renderGames();
      syncFrameHeight();
    }

    select.addEventListener("change", () => {
      selectedIndex = Number(select.value);
      renderGames();
    });
    document.getElementById("prev").addEventListener("click", () => {
      track.scrollBy({ left: window.innerWidth <= 650 ? -track.clientWidth : -528, behavior: "smooth" });
    });
    document.getElementById("next").addEventListener("click", () => {
      track.scrollBy({ left: window.innerWidth <= 650 ? track.clientWidth : 528, behavior: "smooth" });
    });

    window.addEventListener("resize", syncFrameHeight);

    window.addEventListener("message", event => {
      if (event.data?.type === "streamlit:render") {
        renderScorebar(event.data.args ?? {});
      }
    });

    sendMessage("streamlit:componentReady", { apiVersion: 1 });
    syncFrameHeight();
  </script>
</body>
</html>
